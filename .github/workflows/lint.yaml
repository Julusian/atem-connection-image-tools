name: Lint

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install rust
        # version and components are defined in rust-toolchain.toml
        run: rustup toolchain install

      - name: Install dependencies
        run: |
          npm install -g corepack
          corepack enable
          yarn install

      - name: Lint
        run: yarn lint

      - name: Cargo fmt
        run: |
          cd native
          cargo fmt -- --check

      - name: Clippy
        run: |
          cd native
          cargo clippy
