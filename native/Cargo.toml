[package]
edition = "2024"
name = "atem-connection-image-tools"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Enable napi feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
